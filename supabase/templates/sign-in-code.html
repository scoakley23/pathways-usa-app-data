<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Pathways code</title>
</head>
<body style="margin:0;padding:0;background:#F5F7FA;font-family:Lexend,Arial,Helvetica,sans-serif;color:#1E2B45;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F7FA;">
  <tr>
    <td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:20px;">
        <tr>
          <td style="padding:28px 24px 8px 24px;">
            <p style="margin:0 0 8px 0;font-size:18px;font-weight:bold;">Your Pathways sign-in code</p>
            <p style="margin:0;font-size:40px;line-height:1.2;font-weight:bold;letter-spacing:8px;color:#1E2B45;">{{ .Token }}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px 8px 24px;font-size:16px;line-height:1.5;">
            <p style="margin:0 0 12px 0;">Type this code in Pathways to sign in. It works for 10 minutes.</p>
            <p style="margin:0;">Didn't ask for it? Ignore this email. Nobody can sign in without the code.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px 24px 24px;font-size:13px;line-height:1.5;color:#4E5A70;">
            Pathways USA &middot; Free practice
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
