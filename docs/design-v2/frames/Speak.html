<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix speaking</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
a{color:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1E2B45;color:#fff;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="mtw"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:flex;align-items:center;gap:12px;padding:52px 20px 0 10px">
    <button style="width:44px;height:44px;background:none;border:0;display:flex;align-items:center;justify-content:center" aria-label="Close lesson"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="flex:1;display:flex;gap:4px" role="img" aria-label="Step 3 of 5">
      <span style="flex:1;height:6px;border-radius:3px;background:#FFC23D"></span><span style="flex:1;height:6px;border-radius:3px;background:#FFC23D"></span><span style="flex:1;height:6px;border-radius:3px;background:#fff"></span><span style="flex:1;height:6px;border-radius:3px;background:#3A4A6B"></span><span style="flex:1;height:6px;border-radius:3px;background:#3A4A6B"></span>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:30px 20px 0">
    <svg width="80" height="82" viewBox="-10 -26 150 154" role="img" aria-label="Amio listening" style="flex:none"><use href="#ab"/>
      <circle cx="45" cy="50" r="15" fill="#fff"/><circle cx="77" cy="50" r="15" fill="#fff"/><circle cx="47" cy="50" r="7.500" fill="#1E2B45"/><circle cx="79" cy="50" r="7.500" fill="#1E2B45"/><ellipse cx="62" cy="76" rx="5" ry="4" fill="#1E2B45"/><use href="#mtw"/></svg>
    <div style="position:relative;flex:1;color:#1E2B45">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:16px;font-weight:600;line-height:1.3">Te pregunto en inglés. Contesta en voz alta.</div>
    </div>
  </div>

  <div style="padding:40px 24px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1">How many U.S. senators are there?</div>
  <div style="padding:16px 24px 0"><a href="#" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#A9CBEC;font-size:15px;font-weight:600;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9CBEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6"/></svg>Hear it again</a></div>

  <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:46px">
    <button style="width:104px;height:104px;border-radius:52px;background:#FFC23D;border:3px solid #0B1222;box-shadow:0 6px 0 #0B1222;display:flex;align-items:center;justify-content:center" aria-label="Hold to answer">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#1E2B45" stroke-width="2.400" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;margin-top:6px">Hold to answer</div>
    <a href="#" style="font-size:14px;color:#A9CBEC">Type instead</a>
  </div>
</div>
</body>
</html>
