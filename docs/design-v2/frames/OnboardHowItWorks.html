<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Amio works</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#1E2B45;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="fd"><circle cx="46" cy="50" r="13" fill="#fff"/><circle cx="76" cy="50" r="13" fill="#fff"/><circle cx="48.5" cy="52" r="6.5" fill="#1E2B45"/><circle cx="78.5" cy="52" r="6.5" fill="#1E2B45"/><path d="M50 71 Q62 81 74 71" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/></g>
    <g id="mt"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
    <g id="mtw"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:flex;gap:6px;padding:56px 20px 0" role="img" aria-label="Step 2 of 3">
    <span style="flex:1;height:6px;border-radius:3px;background:#1E2B45"></span><span style="flex:1;height:6px;border-radius:3px;background:#1E2B45"></span><span style="flex:1;height:6px;border-radius:3px;background:#E2D8C3"></span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:20px 20px 0">
    <svg width="76" height="78" viewBox="-10 -26 150 154" role="img" aria-label="Amio" style="flex:none"><use href="#ab"/><use href="#fd"/><use href="#mt"/></svg>
    <div style="position:relative;flex:1">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:16px;font-weight:600;line-height:1.3">Así estudiamos juntos.</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;padding:24px 16px 0">
    <div style="background:#1E2B45;color:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px">
      <svg width="52" height="53" viewBox="-10 -26 150 154" aria-hidden="true" style="flex:none"><use href="#ab"/><use href="#fd"/><use href="#mtw"/></svg>
      <div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;line-height:1.1">I explain in Español</div><div style="font-size:14px;color:#A9CBEC;margin-top:4px">So you always understand.</div></div>
    </div>
    <div style="background:#FFC23D;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px">
      <span style="width:52px;height:52px;border-radius:26px;background:#1E2B45;flex:none;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC23D" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></span>
      <div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;line-height:1.1">You answer in English</div><div style="font-size:14px;margin-top:4px">Out loud, like the real interview.</div></div>
    </div>
    <div style="background:#A9CBEC;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px">
      <span style="width:52px;height:52px;border-radius:26px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E2B45" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
      <div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;line-height:1.1">Your voice is never saved</div><div style="font-size:14px;margin-top:4px">Only the words, to check your answer.</div></div>
    </div>
  </div>

  <div style="margin-top:auto;padding:0 16px 40px">
    <button style="width:100%;height:56px;border-radius:12px;background:#1E2B45;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#fff;font-size:18px;font-weight:800">Got it</button>
  </div>
</div>
</body>
</html>
