      <circle cx="46" cy="52" r="13" fill="#fff"/><circle cx="76" cy="52" r="13" fill="#fff"/><circle cx="48.500" cy="55" r="6.500" fill="#1E2B45"/><circle cx="78.500" cy="55" r="6.500" fill="#1E2B45"/><path d="M32 40 L56 31 M90 40 L66 31" fill="none" stroke="#1E2B45" stroke-width="4.500" stroke-linecap="round"/><path d="M52 76 Q62 71 72 76" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/><use href="#mtw"/></svg>

  <div style="padding:34px 24px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05;color:#A9CBEC">How many U.S. senators are there?</div>

  <div style="margin:22px 20px 0;background:#2A3A5C;border-radius:12px;padding:16px 18px">
    <div style="font-size:13px;color:#A9CBEC">You said</div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-top:4px">“Fifty.”</div>
  </div>

  <div style="margin-top:auto;background:#FBF7EE;color:#1E2B45;border-radius:20px 20px 0 0;padding:22px 20px 34px">
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800">Not quite</div>
    <div style="font-size:15px;line-height:1.45;margin-top:4px">The answer is <b>100</b>. There are 50 states, and each one has two senators.</div>
    <button style="width:100%;height:54px;margin-top:18px;border-radius:12px;background:#FFC23D;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#1E2B45;font-size:18px;font-weight:800">Say it once more</button>
