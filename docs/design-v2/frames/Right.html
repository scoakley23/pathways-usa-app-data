<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right answer</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1E2B45;color:#fff;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="mtw"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:flex;align-items:center;gap:12px;padding:52px 20px 0 10px">
    <button style="width:44px;height:44px;background:none;border:0;display:flex;align-items:center;justify-content:center" aria-label="Close lesson"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="flex:1;display:flex;gap:4px" role="img" aria-label="Step 3 of 5 done">
      <span style="flex:1;height:6px;border-radius:3px;background:#FFC23D"></span><span style="flex:1;height:6px;border-radius:3px;background:#FFC23D"></span><span style="flex:1;height:6px;border-radius:3px;background:#FFC23D"></span><span style="flex:1;height:6px;border-radius:3px;background:#3A4A6B"></span><span style="flex:1;height:6px;border-radius:3px;background:#3A4A6B"></span>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:30px 20px 0">
    <svg width="84" height="86" viewBox="-10 -26 150 154" role="img" aria-label="Amio cheering" style="flex:none"><use href="#ab"/>
      <path d="M33 54 Q46 36 59 54 M63 54 Q76 36 89 54" fill="none" stroke="#1E2B45" stroke-width="5.500" stroke-linecap="round"/><path d="M45 66 Q62 94 79 66Z" fill="#1E2B45"/>
      <rect x="2" y="4" width="8" height="8" fill="#FFC23D" transform="rotate(20 6 8)"/><rect x="116" y="40" width="8" height="8" fill="#FFC23D" transform="rotate(-25 120 44)"/><circle cx="112" cy="-8" r="4.500" fill="#A9CBEC"/><circle cx="4" cy="64" r="4" fill="#A9CBEC"/><use href="#mtw"/></svg>
    <div style="position:relative;flex:1;color:#1E2B45">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:17px;font-weight:700;line-height:1.3">¡Eso es! Muy bien dicho.</div>
    </div>
  </div>

  <div style="padding:34px 24px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05;color:#A9CBEC">How many U.S. senators are there?</div>

  <div style="margin:22px 20px 0;background:#2A3A5C;border-radius:12px;padding:16px 18px">
    <div style="font-size:13px;color:#A9CBEC">You said</div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-top:4px">“There are one hundred.”</div>
  </div>

  <div style="margin-top:auto;background:#FFC23D;color:#1E2B45;border-radius:20px 20px 0 0;padding:22px 20px 40px">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <span style="width:34px;height:34px;border-radius:17px;background:#1E2B45;flex:none;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC23D" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></span>
      <div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800">Right</div>
        <div style="font-size:15px;line-height:1.4;margin-top:2px">100 senators: two for each of the 50 states.</div>
      </div>
    </div>
    <button style="width:100%;height:54px;margin-top:20px;border-radius:12px;background:#1E2B45;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#fff;font-size:18px;font-weight:800">Continue</button>
  </div>
</div>
</body>
</html>
