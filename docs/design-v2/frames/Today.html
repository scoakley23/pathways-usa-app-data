<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix home</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#1E2B45;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="fd"><circle cx="46" cy="50" r="13" fill="#fff"/><circle cx="76" cy="50" r="13" fill="#fff"/><circle cx="48.5" cy="52" r="6.5" fill="#1E2B45"/><circle cx="78.5" cy="52" r="6.5" fill="#1E2B45"/><path d="M50 71 Q62 81 74 71" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/></g>
    <g id="mt"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:flex;align-items:center;gap:10px;padding:56px 20px 0">
    <svg width="76" height="78" viewBox="-10 -26 150 154" role="img" aria-label="Amio" style="flex:none"><use href="#ab"/><use href="#fd"/><use href="#mt"/></svg>
    <div style="position:relative;flex:1">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:16px;font-weight:600;line-height:1.3">Buenos días, Lucía. Hoy, Civismo.</div>
    </div>
  </div>

  <div style="margin:22px 16px 0;background:#1E2B45;color:#fff;border-radius:12px;padding:20px 20px 22px">
    <div style="font-size:14px;font-weight:600;color:#A9CBEC">Civics · lesson 3 of 8 · 5 min</div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.02;margin-top:8px">How many senators are there?</div>
    <button style="width:100%;height:54px;margin-top:18px;border-radius:12px;background:#FFC23D;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#1E2B45;font-size:18px;font-weight:800">Start</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 16px 0">
    <div style="background:#3B5B92;color:#fff;border-radius:12px;padding:12px 16px;height:104px;box-sizing:border-box;display:flex;flex-direction:column">
      <div style="font-size:15px;font-weight:600">Reading</div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:auto">75<span style="font-size:17px">%</span></div>
    </div>
    <div style="background:#FFC23D;color:#1E2B45;border-radius:12px;padding:12px 16px;height:104px;box-sizing:border-box;display:flex;flex-direction:column">
      <div style="font-size:15px;font-weight:600">Writing</div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:auto">50<span style="font-size:17px">%</span></div>
    </div>
    <div style="background:#A9CBEC;color:#1E2B45;border-radius:12px;padding:12px 16px;height:104px;box-sizing:border-box;display:flex;flex-direction:column;border:2.500px solid #1E2B45">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:15px;font-weight:700">Civics</span><span style="font-size:11px;font-weight:700;background:#fff;border-radius:6px;padding:2px 7px">Today</span></div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:auto">60<span style="font-size:17px">%</span></div>
    </div>
    <div style="background:#fff;color:#1E2B45;border-radius:12px;padding:12px 16px;height:104px;box-sizing:border-box;display:flex;flex-direction:column;border:1.500px solid #E2D8C3">
      <div style="font-size:15px;font-weight:600">Speaking</div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:auto">30<span style="font-size:17px">%</span></div>
    </div>
  </div>

  <a href="#" style="display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0">
    <span><span style="font-size:14px;color:#6B6555">Interview likely </span><b style="font-size:16px">April – July 2027</b></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2B45" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <nav aria-label="Main" style="margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #E2D8C3;padding:10px 8px 26px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#1E2B45"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1E2B45" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Today</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16M10 4v16M15 6l5 14"/></svg>Course</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>Interview</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Me</div>
  </nav>
</div>
</body>
</html>
