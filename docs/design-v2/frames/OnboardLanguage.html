<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your language</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#1E2B45;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="abr"><g transform="translate(124 0) scale(-1 1)"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g></g>
    <g id="fd"><circle cx="46" cy="50" r="13" fill="#fff"/><circle cx="76" cy="50" r="13" fill="#fff"/><circle cx="48.5" cy="52" r="6.5" fill="#1E2B45"/><circle cx="78.5" cy="52" r="6.5" fill="#1E2B45"/><path d="M50 71 Q62 81 74 71" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/></g>
    <g id="m_en"><circle cx="62" cy="-6" r="7" fill="#1E2B45"/></g>
    <g id="m_es"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
    <g id="m_vi"><path d="M50 2 L62 -10 L74 2" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="m_ht"><path d="M52 -12 L70 4" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
    <g id="m_zh"><path d="M50 -10 L62 2 L74 -10" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="m_ar"><path d="M46 0 Q51 -14 57 -3 Q62 -14 67 -3 Q73 -14 78 0" fill="none" stroke="#1E2B45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs></svg>

  <div style="padding:2px 0 0;display:flex;gap:6px;padding:56px 20px 0" role="img" aria-label="Step 1 of 3">
    <span style="flex:1;height:6px;border-radius:3px;background:#1E2B45"></span><span style="flex:1;height:6px;border-radius:3px;background:#E2D8C3"></span><span style="flex:1;height:6px;border-radius:3px;background:#E2D8C3"></span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:20px 20px 0">
    <svg width="76" height="78" viewBox="-10 -26 150 154" role="img" aria-label="Amio with a tilde" style="flex:none"><use href="#ab"/><use href="#fd"/><use href="#m_es"/></svg>
    <div style="position:relative;flex:1">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:16px;font-weight:600;line-height:1.3">¡Hola! Te explico todo en español.</div>
    </div>
  </div>

  <div style="padding:22px 22px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.02">Which language do you speak best?</div>

  <div style="margin:16px 16px 0;height:46px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:10px;padding:0 14px;color:#6B6555;font-size:15px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>Search 62 languages</div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 16px 0">
    <button aria-pressed="true" style="height:64px;border-radius:12px;background:#A9CBEC;border:2.500px solid #1E2B45;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:800"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#m_es"/></svg>Español</button>
    <button style="height:64px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:600"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#m_en"/></svg>English</button>
    <button style="height:64px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:600"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#m_vi"/></svg>Tiếng Việt</button>
    <button style="height:64px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:600"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#m_ht"/></svg>Kreyòl</button>
    <button style="height:64px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:600"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#m_zh"/></svg>中文</button>
    <button style="height:64px;border-radius:12px;background:#fff;border:1.500px solid #E2D8C3;display:flex;align-items:center;gap:8px;padding:0 10px;color:#1E2B45;font-size:16px;font-weight:600"><svg width="38" height="39" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#abr"/><use href="#fd"/><use href="#m_ar"/></svg>العربية</button>
  </div>

  <div style="margin-top:auto;padding:0 16px 40px">
    <button style="width:100%;height:56px;border-radius:12px;background:#1E2B45;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#fff;font-size:18px;font-weight:800">Continue</button>
  </div>
</div>
</body>
</html>
