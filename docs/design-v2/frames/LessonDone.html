<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson done</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
a{color:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#1E2B45;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="mt"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:flex;align-items:center;gap:10px;padding:64px 20px 0">
    <svg width="104" height="107" viewBox="-10 -26 150 154" role="img" aria-label="Amio, proud, with a gold star" style="flex:none"><use href="#ab"/>
      <path d="M33 56 Q46 40 59 56 M63 56 Q76 40 89 56" fill="none" stroke="#1E2B45" stroke-width="5.500" stroke-linecap="round"/><ellipse cx="32" cy="68" rx="8" ry="5" fill="#FFB3A6"/><ellipse cx="92" cy="68" rx="8" ry="5" fill="#FFB3A6"/><path d="M48 72 Q62 84 76 72" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/>
      <path d="M118 -6 L122 4 L133 5 L125 12 L127 23 L118 17 L109 23 L111 12 L103 5 L114 4Z" fill="#FFC23D"/><use href="#mt"/></svg>
    <div style="position:relative;flex:1">
      <svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M16 6 C80 2 200 4 292 8 C297 34 296 66 291 94 C200 98 100 97 18 93 C15 80 13 66 14 56 L2 46 L15 38 C14 26 14 16 16 6Z" fill="#fff" stroke="#F0503C" stroke-width="2.500" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div style="position:relative;padding:12px 16px 12px 24px;font-size:16px;font-weight:600;line-height:1.3">¡Lo lograste! Mañana: la Cámara de Representantes.</div>
    </div>
  </div>

  <div style="padding:30px 22px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1">Lesson done.</div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:22px 16px 0">
    <div style="background:#1E2B45;color:#fff;border-radius:12px;padding:12px 14px;height:92px;box-sizing:border-box;display:flex;flex-direction:column"><div style="font-size:13px;color:#A9CBEC">Time</div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;margin-top:auto">5 min</div></div>
    <div style="background:#3B5B92;color:#fff;border-radius:12px;padding:12px 14px;height:92px;box-sizing:border-box;display:flex;flex-direction:column"><div style="font-size:13px">Right</div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;margin-top:auto">4 of 5</div></div>
    <div style="background:#FFC23D;color:#1E2B45;border-radius:12px;padding:12px 14px;height:92px;box-sizing:border-box;display:flex;flex-direction:column"><div style="font-size:13px">You know</div><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;margin-top:auto">+3</div></div>
  </div>

  <div style="margin:10px 16px 0;background:#A9CBEC;border-radius:12px;padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">Civics</span><span style="font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800">60 → 64%</span></div>
    <div style="height:6px;border-radius:3px;background:rgba(30,43,69,.18);margin-top:8px;position:relative"><div style="width:60%;height:6px;border-radius:3px;background:#1E2B45"></div><div style="position:absolute;left:60%;top:0;width:4%;height:6px;background:#F5F7FA;border-radius:0 3px 3px 0"></div></div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:20px 22px 0">
    <div style="display:flex;gap:5px" role="img" aria-label="3 days this week">
      <span style="width:16px;height:16px;border-radius:4px;background:#1E2B45"></span><span style="width:16px;height:16px;border-radius:4px;background:#1E2B45"></span><span style="width:16px;height:16px;border-radius:4px;background:#FFC23D;border:2px solid #1E2B45;box-sizing:border-box"></span><span style="width:16px;height:16px;border-radius:4px;border:1.500px solid #CFC5AE;box-sizing:border-box"></span><span style="width:16px;height:16px;border-radius:4px;border:1.500px solid #CFC5AE;box-sizing:border-box"></span><span style="width:16px;height:16px;border-radius:4px;border:1.500px solid #CFC5AE;box-sizing:border-box"></span><span style="width:16px;height:16px;border-radius:4px;border:1.500px dashed #CFC5AE;box-sizing:border-box"></span>
    </div>
    <span style="font-size:14px;color:#6B6555">3 days this week</span>
  </div>

  <div style="margin-top:auto;padding:0 16px 42px">
    <button style="width:100%;height:56px;border-radius:12px;background:#1E2B45;border:2.500px solid #0B1222;box-shadow:0 5px 0 #0B1222;color:#fff;font-size:18px;font-weight:800">Done for today</button>
    <div style="text-align:center;margin-top:14px"><a href="#" style="font-size:15px;font-weight:600">One more lesson</a></div>
  </div>
</div>
</body>
</html>
