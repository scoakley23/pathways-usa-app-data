<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course tab</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#1E2B45;font-family:'Lexend',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="ab"><path d="M60 14 C90 12 108 32 106 58 C104 82 86 98 62 98 C56 98 52 97 48 96 L22 112 L32 88 C18 80 12 66 14 52 C16 30 36 16 60 14Z" fill="#F0503C"/></g>
    <g id="fd"><circle cx="46" cy="50" r="13" fill="#fff"/><circle cx="76" cy="50" r="13" fill="#fff"/><circle cx="48.5" cy="52" r="6.5" fill="#1E2B45"/><circle cx="78.5" cy="52" r="6.5" fill="#1E2B45"/><path d="M50 71 Q62 81 74 71" fill="none" stroke="#1E2B45" stroke-width="5" stroke-linecap="round"/></g>
    <g id="mt"><path d="M42 -2 Q52 -16 62 -6 T82 -6" fill="none" stroke="#1E2B45" stroke-width="8" stroke-linecap="round"/></g>
  </defs></svg>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:56px 16px 0" role="tablist" aria-label="Parts of the test">
    <button role="tab" style="height:44px;border:0;border-radius:10px;background:#3B5B92;color:#fff;font-size:14px;font-weight:600;opacity:.45">Reading</button>
    <button role="tab" style="height:44px;border:0;border-radius:10px;background:#FFC23D;color:#1E2B45;font-size:14px;font-weight:600;opacity:.45">Writing</button>
    <button role="tab" aria-selected="true" style="height:44px;border:2.500px solid #1E2B45;border-radius:10px;background:#A9CBEC;color:#1E2B45;font-size:14px;font-weight:800">Civics</button>
    <button role="tab" style="height:44px;border:1.500px solid #E2D8C3;border-radius:10px;background:#fff;color:#1E2B45;font-size:14px;font-weight:600">Speaking</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:baseline;padding:20px 22px 0">
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800;letter-spacing:-1.2px">Civics</div>
    <div style="font-size:14px;color:#6B6555">41 of 128 questions</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;padding:12px 16px 0">

    <a href="#" style="background:#1E2B45;color:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1"><div style="font-size:16px;font-weight:700">Symbols and holidays</div>
        <div style="display:flex;gap:3px;margin-top:8px"><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span></div></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC23D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12l5 5L19 7"/></svg></a>

    <div style="background:#A9CBEC;border:2.500px solid #1E2B45;border-radius:12px;padding:12px 16px 14px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><div style="font-size:16px;font-weight:800">How government works</div><div style="font-size:13px;margin-top:2px">Lesson 3 of 8 · How many senators?</div></div>
        <svg width="44" height="45" viewBox="-10 -26 150 154" aria-hidden="true"><use href="#ab"/><use href="#fd"/><use href="#mt"/></svg>
      </div>
      <div style="display:flex;gap:3px;margin-top:8px" role="img" aria-label="2 lessons done, lesson 3 next, 5 more">
        <span style="flex:1;height:8px;border-radius:2px;background:#1E2B45"></span><span style="flex:1;height:8px;border-radius:2px;background:#1E2B45"></span><span style="flex:1;height:8px;border-radius:2px;background:#fff;border:2px solid #1E2B45;box-sizing:border-box"></span><span style="flex:1;height:8px;border-radius:2px;background:rgba(30,43,69,.18)"></span><span style="flex:1;height:8px;border-radius:2px;background:rgba(30,43,69,.18)"></span><span style="flex:1;height:8px;border-radius:2px;background:rgba(30,43,69,.18)"></span><span style="flex:1;height:8px;border-radius:2px;background:rgba(30,43,69,.18)"></span><span style="flex:1;height:8px;border-radius:2px;background:rgba(30,43,69,.18)"></span>
      </div>
      <button style="width:100%;height:48px;margin-top:12px;border-radius:12px;background:#1E2B45;border:2.500px solid #0B1222;box-shadow:0 4px 0 #0B1222;color:#fff;font-size:16px;font-weight:800">Continue</button>
    </div>

    <a href="#" style="background:#fff;border:1.500px solid #E2D8C3;border-radius:12px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:700">Rights</span><span style="font-size:13px;color:#6B6555">6 lessons</span></div>
      <div style="display:flex;gap:3px;margin-top:8px"><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span></div></a>

    <a href="#" style="background:#fff;border:1.500px solid #E2D8C3;border-radius:12px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:700">Early history</span><span style="font-size:13px;color:#6B6555">7 lessons</span></div>
      <div style="display:flex;gap:3px;margin-top:8px"><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span></div></a>

    <a href="#" style="background:#fff;border:1.500px solid #E2D8C3;border-radius:12px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:700">1800s</span><span style="font-size:13px;color:#6B6555">5 lessons</span></div>
      <div style="display:flex;gap:3px;margin-top:8px"><span style="flex:1;height:8px;border-radius:2px;background:#FFC23D"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span></div></a>

    <a href="#" style="background:#fff;border:1.500px solid #E2D8C3;border-radius:12px;padding:12px 16px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:700">Recent history</span><span style="font-size:13px;color:#6B6555">5 lessons</span></div>
      <div style="display:flex;gap:3px;margin-top:8px"><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span><span style="flex:1;height:8px;border-radius:2px;background:#EFE7D6"></span></div></a>
  </div>

  <nav aria-label="Main" style="margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #E2D8C3;padding:10px 8px 26px;background:#FBF7EE">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Today</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#1E2B45"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2B45" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16M10 4v16M15 6l5 14"/></svg>Course</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>Interview</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B6555"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6555" stroke-width="1.800" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Me</div>
  </nav>
</div>
</body>
</html>
