schema: spec-driven

context: |
  Follow the rules in CLAUDE.md (legal, privacy, design, tutor tone).
  Pathways USA is a free education app, not a legal service: no advice on how a learner should answer N-400 questions or whether they are eligible.
  Never change, add, or invent official USCIS civics answers.
  Never store immigration status, A-number, case details, address, or N-400 answers; the target date and location stay on the device only.
  Merging to main updates the live Base44 app; work on branches and merge via pull request.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
